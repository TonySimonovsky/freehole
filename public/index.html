<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Freehole</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #0b0f17; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #hud { position: fixed; top: 8px; left: 8px; padding: 6px 10px; background: rgba(0,0,0,0.35); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    canvas { display: block; width: 100vw; height: 100vh; }
    a { color: #7cc0ff; text-decoration: none; }
  </style>
</head>
<body>
  <div id="hud">Score: <span id="score">0</span></div>
  <canvas id="game"></canvas>
  <script type="module" src="./bundle.js"></script>
</body>
</html>
